# miadi-terminal session continuity: tmux saves its sessions and restores them when its server
# starts, and tide brings the agents back into their panes. `miadi-terminal enable restore` adds
# a source-file line for this file to ~/.tmux.conf and enables tmux-server.service, which starts
# the server at boot, and tmux-save.timer.
#
# These are the settings of the managed block that jgwill/gaia linux_migration/14-tmux-resurrect.sh
# writes (jgwill/gaia#89, jgwill/gaia#90). Change both together.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# tmux-save.timer saves every 15 minutes, attached client or not. continuum saves only while a
# client redraws its status line, so here it only restores.
set -g @continuum-save-interval '0'
set -g @continuum-restore 'on'
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
# The visible screen only: capturing a pane's full scrollback blocks every pane of the server,
# about 1.4 s per 47,000 lines (measured on gaia 2026-09-28). The visible screen takes 13 ms.
set -g @resurrect-capture-pane-contents-area 'visible'
# Each pane's command from /proc instead of one ps of every process per pane.
set -g @resurrect-save-command-strategy 'linux_procfs'
# Repair pane lines whose empty title shifted the fields (tmux-resurrect scripts/save.sh:192).
set -g @resurrect-hook-post-save-layout 'bash /usr/share/miadi-terminal/session-continuity/repair-save.sh'
# After a restore, tide brings the agents back (jgwill/Miadi#691).
set -g @resurrect-hook-post-restore-all 'bash /usr/share/miadi-terminal/session-continuity/restore-agents.sh'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-strategy-vim 'session'
run '~/.tmux/plugins/tpm/tpm'
